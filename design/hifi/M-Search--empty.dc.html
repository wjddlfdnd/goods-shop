<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 검색 (결과 없음)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
/* 선 그림 아이콘 바로 아래에 빈 상태 블록을 붙인다 */
.hf-empty .gs-empty{padding-top:var(--space-4)}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 504px; box-sizing: border-box; display: flex; flex-direction: column; padding-bottom: var(--space-12); background: var(--bg); color: var(--text-body);">
  <x-import component-from-global-scope="GoodsShop.MobileHeader" back="Main.dc.html" title="상품 검색" cart-count="{{cartCount}}" links="{{links}}"></x-import>

  <form role="search" aria-label="상품 검색" style="margin: 0; padding: var(--space-4) var(--grid-mobile-margin) 0;">
    <x-import component-from-global-scope="GoodsShop.SearchField" id="q" label="상품명 검색어" value="우주 고양이" placeholder="상품명으로 검색" clear-label="검색어 지우기"></x-import>
  </form>

  <main class="hf-empty" style="padding: 0 var(--grid-mobile-margin); display: flex; flex-direction: column;">
    <div aria-hidden="true" style="margin-top: var(--space-12); display: flex; justify-content: center; color: var(--gray-400);"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="28" cy="28" r="16"/><path d="M40 40l12 12"/><path d="M22 24h0M34 24h0"/><path d="M23 34c3-2.5 7-2.5 10 0"/></svg></div>
    <x-import component-from-global-scope="GoodsShop.EmptyState" title="'우주 고양이'에 맞는 상품이 없습니다" text="검색어를 줄이거나 다른 상품명으로 다시 검색해 보세요." action-text="전체 상품 보기" href="M-List.dc.html"></x-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":504}}'>
class Component extends DCLogic {
renderVals() {
  return {
    cartCount: 3,
    links: { cart: 'M-Cart.dc.html' }
  };
}
}
</script>
</body>
</html>
