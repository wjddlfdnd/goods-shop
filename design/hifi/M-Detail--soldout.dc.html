<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 상세 (전체 품절)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dt-head .gs-header__title{text-align:center}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 1328px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text-body);">
  <div class="dt-head">
    <x-import component-from-global-scope="GoodsShop.MobileHeader" back="M-List.dc.html" title="상품 보기" title-as="p" cart-count="{{cartCount}}" links="{{links}}"></x-import>
  </div>

  <x-import component-from-global-scope="GoodsShop.Carousel" count="{{three}}" current="{{zero}}" label="별빛 홀로그램 스티커 세트 이미지">
    <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--gray-400);"><svg viewBox="0 0 64 64" style="width: 40%; height: auto;" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 10h30l8 8v36H14z"/><path d="M44 10v8h8"/><path d="M33 20l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1-7.2-3.8-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z"/></svg></div>
  </x-import>

  <section aria-label="상품 정보" style="padding: var(--space-6) var(--grid-mobile-margin) var(--space-12); display: flex; flex-direction: column;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);">
      <x-import component-from-global-scope="GoodsShop.Label" kind="soldout"></x-import>
      <x-import component-from-global-scope="GoodsShop.InfoPill">무료배송</x-import>
      <x-import component-from-global-scope="GoodsShop.InfoPill">옵션 2개</x-import>
      <x-import component-from-global-scope="GoodsShop.InfoPill">스티커</x-import>
    </div>
    <h1 class="heading-xl-mobile" style="margin: var(--space-4) 0 0; color: var(--text);">별빛 홀로그램 스티커 세트</h1>
    <p class="price-detail" style="margin: var(--space-2) 0 0; color: var(--text);">4,500원</p>
    <p class="body-15" style="margin: var(--space-4) 0 0; color: var(--text-body);">빛을 받으면 반짝이는 홀로그램 별 스티커 3장 세트입니다. 다이어리나 폰 케이스 꾸미기에 좋고, 방수 코팅이 되어 있어요.</p>
    <div style="margin-top: var(--space-4);">
      <x-import component-from-global-scope="GoodsShop.Notice" live="{{yes}}"><b style="color: var(--text);">모든 옵션이 품절되었습니다.</b><br>지금은 장바구니에 담거나 구매할 수 없습니다.</x-import>
    </div>
  </section>

  <hr class="gs-divider">

  <section aria-label="옵션" style="padding: var(--space-8) var(--grid-mobile-margin);">
    <x-import component-from-global-scope="GoodsShop.SectionHeader" title="옵션 선택"></x-import>
    <x-import component-from-global-scope="GoodsShop.SelectField" id="opt" label="옵션" placeholder="옵션을 선택하세요" options="{{optOptions}}" disabled="{{yes}}" hint="모든 옵션이 품절되어 선택할 수 없습니다"></x-import>
  </section>

  <hr class="gs-divider">

  <section aria-label="배송 안내" style="padding: var(--space-8) var(--grid-mobile-margin) var(--space-12);">
    <x-import component-from-global-scope="GoodsShop.SectionHeader" title="배송 안내"></x-import>
    <x-import component-from-global-scope="GoodsShop.Notice"><b style="color: var(--text);">배송비 0원</b><br>모든 주문은 배송비 없이 보내 드립니다.</x-import>
  </section>

  <div style="margin-top: auto;">
    <p id="buy-reason" class="caption" style="margin: 0; padding: 0 var(--grid-mobile-margin) var(--space-3); text-align: center; color: var(--text-sub);">모든 옵션이 품절이라 담기·구매 버튼을 누를 수 없습니다</p>
    <x-import component-from-global-scope="GoodsShop.StickyBar" static="{{yes}}">
      <x-import component-from-global-scope="GoodsShop.Button" variant="secondary" size="L" full="{{yes}}" disabled="{{yes}}">장바구니 담기</x-import>
      <x-import component-from-global-scope="GoodsShop.Button" variant="primary" size="L" full="{{yes}}" disabled="{{yes}}">바로 구매</x-import>
    </x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1328}}'>
class Component extends DCLogic {
renderVals() {
  return {
    yes: true,
    cartCount: 3,
    links: { cart: 'M-Cart.dc.html' },
    three: 3,
    zero: 0,
    optOptions: [
      { label: '홀로그램 실버 · 품절', disabled: true },
      { label: '오로라 핑크 · 품절', disabled: true }
    ]
  };
}
}
</script>
</body>
</html>
