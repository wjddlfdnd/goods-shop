<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 상세 (찾을 수 없음)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.hf-empty .gs-empty{padding-top:var(--space-4)}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 560px; box-sizing: border-box; display: flex; flex-direction: column; padding-bottom: var(--space-12); background: var(--bg); color: var(--text-body);">
  <x-import component-from-global-scope="GoodsShop.MobileHeader" back="Main.dc.html" title="상품 보기" title-as="p" cart-count="{{cartCount}}" links="{{links}}"></x-import>

  <main class="hf-empty" style="padding: var(--space-6) var(--grid-mobile-margin) 0; display: flex; flex-direction: column;">
    <h1 class="heading-xl-mobile" style="margin: 0; color: var(--text);">상품을 찾을 수 없습니다</h1>
    <div aria-hidden="true" style="margin-top: var(--space-12); display: flex; justify-content: center; color: var(--gray-400);"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12 22l20-10 20 10v22L32 54 12 44z"/><path d="M12 22l20 10 20-10"/><path d="M32 32v22"/><path d="M28 18h0"/></svg></div>
    <x-import component-from-global-scope="GoodsShop.EmptyState" title="삭제되었거나 주소가 잘못된 상품입니다" text="주소를 다시 확인하거나 홈에서 다른 굿즈를 둘러보세요." action-text="홈으로 가기" href="Main.dc.html"></x-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic {
renderVals() {
  return {
    cartCount: 3,
    links: { cart: 'M-Cart.dc.html' }
  };
}
}
</script>
</body>
</html>
