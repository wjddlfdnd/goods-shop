<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 검색</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
/* 카드 이미지 자리 라벨은 aria-label로만 두고, 위에 겹친 선 그림을 보여 준다 */
.hf-card .gs-card__img{font-size:0}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 896px; box-sizing: border-box; display: flex; flex-direction: column; padding-bottom: var(--space-12); background: var(--bg); color: var(--text-body);">
  <x-import component-from-global-scope="GoodsShop.MobileHeader" back="Main.dc.html" title="상품 검색" cart-count="{{cartCount}}" links="{{links}}"></x-import>

  <form role="search" aria-label="상품 검색" style="margin: 0; padding: var(--space-4) var(--grid-mobile-margin) 0;">
    <x-import component-from-global-scope="GoodsShop.SearchField" id="q" label="상품명 검색어" value="스티커" placeholder="상품명으로 검색" clear-label="검색어 지우기"></x-import>
  </form>

    <div style="margin-top: var(--space-6); min-height: var(--touch-min); display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);">
      <p class="body-sm-14" style="margin: 0; min-width: 0; color: var(--text-sub);">'<b style="color: var(--text);">스티커</b>' 검색 결과 <b style="color: var(--text);">4</b>개</p>

        <x-import component-from-global-scope="GoodsShop.SortButton" label="최신순"></x-import>
      </div>
    </div>

    <div class="gs-card-grid" style="margin-top: var(--space-4);">
        <div class="hf-card" style="position: relative; min-width: 0;">
          <x-import component-from-global-scope="GoodsShop.ProductCard" name="별빛 홀로그램 스티커 세트" price="4,500원" image-label="별빛 홀로그램 스티커 세트 이미지" href="M-Detail.dc.html"></x-import>
          <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; color: var(--gray-400); pointer-events: none;"><svg viewBox="0 0 64 64" style="width: 44%; height: auto;" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 10h30l8 8v36H14z"/><path d="M44 10v8h8"/><path d="M33 20l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1-7.2-3.8-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z"/></svg></div>
        </div>
        <div class="hf-card" style="position: relative; min-width: 0;">
          <x-import component-from-global-scope="GoodsShop.ProductCard" name="고양이 일상 씰 스티커" price="3,500원" image-label="고양이 일상 씰 스티커 이미지" href="M-Detail.dc.html"></x-import>
          <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; color: var(--gray-400); pointer-events: none;"><svg viewBox="0 0 64 64" style="width: 44%; height: auto;" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 10h30l8 8v36H14z"/><path d="M44 10v8h8"/><path d="M33 20l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1-7.2-3.8-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z"/></svg></div>
        </div>
        <div class="hf-card" style="position: relative; min-width: 0;">
          <x-import component-from-global-scope="GoodsShop.ProductCard" name="레트로 라벨 스티커 팩" price="5,000원" image-label="레트로 라벨 스티커 팩 이미지" href="M-Detail.dc.html"></x-import>
          <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; color: var(--gray-400); pointer-events: none;"><svg viewBox="0 0 64 64" style="width: 44%; height: auto;" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 10h30l8 8v36H14z"/><path d="M44 10v8h8"/><path d="M33 20l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1-7.2-3.8-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z"/></svg></div>
        </div>
        <div class="hf-card" style="position: relative; min-width: 0;">
          <x-import component-from-global-scope="GoodsShop.ProductCard" name="손글씨 문구 투명 스티커" price="3,000원" image-label="손글씨 문구 투명 스티커 이미지" href="M-Detail.dc.html"></x-import>
          <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; color: var(--gray-400); pointer-events: none;"><svg viewBox="0 0 64 64" style="width: 44%; height: auto;" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 10h30l8 8v36H14z"/><path d="M44 10v8h8"/><path d="M33 20l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1-7.2-3.8-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z"/></svg></div>
        </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":896}}'>
class Component extends DCLogic {
renderVals() {
  return {
    yes: true,
    cartCount: 3,
    links: { cart: 'M-Cart.dc.html' }
  };
}
}
</script>

</html>
