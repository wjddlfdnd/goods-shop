<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 검색 (빈 검색어)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 288px; box-sizing: border-box; display: flex; flex-direction: column; padding-bottom: var(--space-12); background: var(--bg); color: var(--text-body);">
  <x-import component-from-global-scope="GoodsShop.MobileHeader" back="Main.dc.html" title="상품 검색" cart-count="{{cartCount}}" links="{{links}}"></x-import>

  <form role="search" aria-label="상품 검색" style="margin: 0; padding: var(--space-4) var(--grid-mobile-margin) 0;">
    <x-import component-from-global-scope="GoodsShop.SearchField" id="q" label="상품명 검색어" value="" placeholder="상품명으로 검색" clear-label="검색어 지우기" error="검색어를 입력해 주세요"></x-import>
  </form>

  <main style="padding: 0 var(--grid-mobile-margin);">
    <div style="margin-top: var(--space-6);">
      <x-import component-from-global-scope="GoodsShop.Notice">상품명으로 검색합니다. 입력 후 키보드의 검색을 누르세요.</x-import>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":288}}'>
class Component extends DCLogic {
renderVals() {
  return {
    cartCount: 3,
    links: { cart: 'M-Cart.dc.html' }
  };
}
}
</script>
</body>
</html>
