<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 목록 (상품 없음)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
/* 선 그림 아이콘 바로 아래에 빈 상태 블록을 붙인다 */
.hf-empty .gs-empty{padding-top:var(--space-4)}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 576px; box-sizing: border-box; display: flex; flex-direction: column; padding-bottom: var(--space-12); background: var(--bg); color: var(--text-body);">
  <x-import component-from-global-scope="GoodsShop.MobileHeader" title-as="p" cart-count="{{cartCount}}" links="{{links}}"></x-import>
  <x-import component-from-global-scope="GoodsShop.CategoryTabs" items="{{cats}}" current="{{currentCat}}" href="M-List.dc.html"></x-import>

  <main class="hf-empty" style="padding: 0 var(--grid-mobile-margin); display: flex; flex-direction: column;">
    <h1 class="heading-xl-mobile" style="margin: var(--space-8) 0 0; color: var(--text);">의류</h1>
    <div aria-hidden="true" style="margin-top: var(--space-12); display: flex; justify-content: center; color: var(--gray-400);"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M24 10l-14 7 4 10 6-2.5V54h24V24.5l6 2.5 4-10-14-7c-1.5 4-4.5 6.5-8 6.5s-6.5-2.5-8-6.5z"/></svg></div>
    <x-import component-from-global-scope="GoodsShop.EmptyState" title="이 카테고리에 판매 중인 상품이 없습니다" text="다른 카테고리를 둘러보거나 전체 상품을 확인해 보세요." action-text="전체 상품 보기" href="M-List.dc.html"></x-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":576}}'>
class Component extends DCLogic {
renderVals() {
  return {
    cartCount: 3,
    links: { home: 'Main.dc.html', search: 'M-Search.dc.html', account: 'M-Login.dc.html', cart: 'M-Cart.dc.html' },
    cats: ['전체', '키링', '스티커', '포토카드', '엽서', '의류', '문구류'],
    currentCat: 5
  };
}
}
</script>
</body>
</html>
