<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주문 완료 (O-06)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 1416px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text-body); font-family: var(--font-sans);">
  <x-import component-from-global-scope="GoodsShop.MobileHeader" title-as="p" cart-count="{{cartCount}}" links="{{links}}"></x-import>

  <div style="padding: var(--space-12) var(--grid-mobile-margin) var(--space-12);">
    <section style="display: flex; flex-direction: column; align-items: center; text-align: center;">
      <span style="display: flex; color: var(--text);"><x-import component-from-global-scope="GoodsShop.Icon" name="check" size="{{iconL}}"></x-import></span>
      <h1 class="heading-lg-mobile" style="margin: var(--space-4) 0 0; color: var(--text);">주문이 완료되었습니다</h1>
      <p class="body-sm-14" style="margin: var(--space-3) 0 0; display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); background: var(--surface); color: var(--text); font-weight: 700;"><x-import component-from-global-scope="GoodsShop.Icon" name="check" size="{{iconS}}"></x-import><span>결제 완료</span></p>
    </section>

    <div class="gs-surface body-sm-14" style="margin-top: var(--space-8); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);">
      <span style="color: var(--text-sub);">주문 번호</span>
      <b style="color: var(--text);">20261125-000123</b>
    </div>

    <section style="margin-top: var(--space-12);">
      <x-import component-from-global-scope="GoodsShop.SectionHeader" title="주문 상품 3건"></x-import>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--space-4);">
        <li style="display: flex; gap: var(--space-3);">
          <div role="img" aria-label="고양이 산책 아크릴 키링 이미지" style="flex: none; width: var(--thumb-width); height: var(--thumb-height); border-radius: var(--radius-sm); background: var(--placeholder); color: var(--gray-500); display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="8" r="5"/><path d="M24 13v5"/><path d="M14 24l2-6 4 3h8l4-3 2 6"/><rect x="12" y="20" width="24" height="22" rx="10"/><circle cx="19.5" cy="30" r="1"/><circle cx="28.5" cy="30" r="1"/><path d="M22 34.5q2 1.5 4 0"/></svg></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1);">
            <span class="body-sm-14">고양이 산책 아크릴 키링</span>
            <span class="body-sm-13" style="color: var(--text-sub);">크림 고양이 · 2개</span>
            <span class="price-card-14" style="color: var(--text);">17,800원</span>
          </div>
        </li>
        <li style="display: flex; gap: var(--space-3);">
          <div role="img" aria-label="별빛 홀로그램 스티커 세트 이미지" style="flex: none; width: var(--thumb-width); height: var(--thumb-height); border-radius: var(--radius-sm); background: var(--placeholder); color: var(--gray-500); display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 7l5 10.5 11.5 1.6-8.3 8 2 11.4L24 33l-10.2 5.5 2-11.4-8.3-8L19 17.5z"/><path d="M40 6v6M37 9h6"/><path d="M8 36v4M6 38h4"/></svg></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1);">
            <span class="body-sm-14">별빛 홀로그램 스티커 세트</span>
            <span class="body-sm-13" style="color: var(--text-sub);">홀로그램 실버 · 1개</span>
            <span class="price-card-14" style="color: var(--text);">4,500원</span>
          </div>
        </li>
        <li style="display: flex; gap: var(--space-3);">
          <div role="img" aria-label="봄날 일러스트 엽서 5종 이미지" style="flex: none; width: var(--thumb-width); height: var(--thumb-height); border-radius: var(--radius-sm); background: var(--placeholder); color: var(--gray-500); display: flex; align-items: center; justify-content: center;"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="38" height="26" rx="3"/><rect x="32" y="15" width="7" height="8" rx="1"/><path d="M9 27h14M9 31h10"/><path d="M9 20l4-4 4 4 3-3 3 3"/></svg></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1);">
            <span class="body-sm-14">봄날 일러스트 엽서 5종</span>
            <span class="body-sm-13" style="color: var(--text-sub);">기본 구성 · 1개</span>
            <span class="price-card-14" style="color: var(--text);">6,000원</span>
          </div>
        </li>
      </ul>
    </section>

    <section style="margin-top: var(--space-12);">
      <x-import component-from-global-scope="GoodsShop.SectionHeader" title="결제 정보"></x-import>
      <x-import component-from-global-scope="GoodsShop.OrderSummary" rows="{{pay}}" total="{{total}}"></x-import>
    </section>

    <section style="margin-top: var(--space-12);">
      <x-import component-from-global-scope="GoodsShop.SectionHeader" title="배송지"></x-import>
      <div class="body-sm-14" style="display: flex; flex-direction: column; gap: var(--space-1);">
        <span>김하늘 · 010-1234-5678</span>
        <span style="color: var(--text-sub);">서울시 마포구 굿즈로 12 3층 301호</span>
        <span style="color: var(--text-sub);">요청사항: 문 앞에 놓아 주세요</span>
      </div>
    </section>

    <div style="margin-top: var(--space-12);">
      <x-import component-from-global-scope="GoodsShop.Button" variant="dark" size="M" full="{{yes}}" href="Main.dc.html">쇼핑 계속하기</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1416}}'>
class Component extends DCLogic {
renderVals() {
  return {
    yes: true,
    cartCount: 0,
    iconL: 48,
    iconS: 16,
    links: { home: 'Main.dc.html', search: 'M-Search.dc.html', account: 'M-Login.dc.html', cart: 'M-Cart.dc.html' },
    pay: [
      { label: '결제 수단', value: '카드 (모의 결제)' },
      { label: '상품 금액', value: '28,300원' },
      { label: '배송비', value: '0원' },
      { label: '할인', value: '0원' }
    ],
    total: { label: '결제 금액', value: '28,300원' }
  };
}
}
</script>
</body>
</html>
