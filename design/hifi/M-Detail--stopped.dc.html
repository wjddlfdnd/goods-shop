<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 상세 (판매 중지)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.dt-head .gs-header__title{text-align:center}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 1384px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text-body);">
  <div class="dt-head">
    <x-import component-from-global-scope="GoodsShop.MobileHeader" back="M-Cart--unavailable.dc.html" title="상품 보기" title-as="p" cart-count="{{cartCount}}" links="{{links}}"></x-import>
  </div>

  <x-import component-from-global-scope="GoodsShop.Carousel" count="{{three}}" current="{{zero}}" label="곰돌이 포토카드 홀더 이미지">
    <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--gray-400);"><svg viewBox="0 0 64 64" style="width: 40%; height: auto;" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="16" y="10" width="32" height="46" rx="4"/><rect x="21" y="17" width="22" height="30" rx="2"/><path d="M26 10V6h12v4"/><circle cx="27" cy="27" r="3"/><circle cx="37" cy="27" r="3"/><circle cx="32" cy="34" r="6"/><path d="M30 36c1.3 1 2.7 1 4 0"/></svg></div>
  </x-import>

  <section aria-label="상품 정보" style="padding: var(--space-6) var(--grid-mobile-margin) var(--space-12); display: flex; flex-direction: column;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);">
      <x-import component-from-global-scope="GoodsShop.Label" kind="stopped"></x-import>
      <x-import component-from-global-scope="GoodsShop.InfoPill">무료배송</x-import>
      <x-import component-from-global-scope="GoodsShop.InfoPill">옵션 2개</x-import>
      <x-import component-from-global-scope="GoodsShop.InfoPill">포토카드</x-import>
    </div>
    <h1 class="heading-xl-mobile" style="margin: var(--space-4) 0 0; color: var(--text);">곰돌이 포토카드 홀더</h1>
    <p class="price-detail" style="margin: var(--space-2) 0 0; color: var(--text);">7,500원</p>
    <p class="body-15" style="margin: var(--space-4) 0 0; color: var(--text-body);">곰돌이 얼굴 모양 창이 있는 투명 포토카드 홀더입니다. 일반 포토카드(5.5 × 8.5cm) 한 장이 들어가고, 위쪽 고리에 볼체인을 걸 수 있어요.</p>
    <div style="margin-top: var(--space-4);">
      <x-import component-from-global-scope="GoodsShop.Notice" live="{{yes}}"><b style="color: var(--text);">판매가 중지된 상품입니다.</b><br>장바구니에 담거나 바로 구매할 수 없습니다.</x-import>
    </div>
    <a class="gs-link gs-link--strong body-sm-14" href="M-List.dc.html" style="margin-top: var(--space-3); align-self: flex-start; min-height: var(--touch-min); display: inline-flex; align-items: center;"><span>포토카드 상품 보러 가기 →</span></a>
  </section>

  <hr class="gs-divider">

  <section aria-label="옵션" style="padding: var(--space-8) var(--grid-mobile-margin);">
    <x-import component-from-global-scope="GoodsShop.SectionHeader" title="옵션 선택"></x-import>
    <x-import component-from-global-scope="GoodsShop.SelectField" id="opt" label="옵션" placeholder="옵션을 선택하세요" options="{{optOptions}}" disabled="{{yes}}" hint="판매 중지 상품은 옵션을 선택할 수 없습니다"></x-import>
  </section>

  <hr class="gs-divider">

  <section aria-label="배송 안내" style="padding: var(--space-8) var(--grid-mobile-margin) var(--space-12);">
    <x-import component-from-global-scope="GoodsShop.SectionHeader" title="배송 안내"></x-import>
    <x-import component-from-global-scope="GoodsShop.Notice"><b style="color: var(--text);">배송비 0원</b><br>모든 주문은 배송비 없이 보내 드립니다.</x-import>
  </section>

  <div style="margin-top: auto;">
    <p id="buy-reason" class="caption" style="margin: 0; padding: 0 var(--grid-mobile-margin) var(--space-3); text-align: center; color: var(--text-sub);">판매 중지 상품이라 담기·구매 버튼을 누를 수 없습니다</p>
    <x-import component-from-global-scope="GoodsShop.StickyBar" static="{{yes}}">
      <x-import component-from-global-scope="GoodsShop.Button" variant="secondary" size="L" full="{{yes}}" disabled="{{yes}}">장바구니 담기</x-import>
      <x-import component-from-global-scope="GoodsShop.Button" variant="primary" size="L" full="{{yes}}" disabled="{{yes}}">바로 구매</x-import>
    </x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1384}}'>
class Component extends DCLogic {
renderVals() {
  return {
    yes: true,
    cartCount: 3,
    links: { cart: 'M-Cart--unavailable.dc.html' },
    three: 3,
    zero: 0,
    optOptions: [
      { label: '클리어 · 재고 8개' },
      { label: '라벤더 · 재고 3개' }
    ]
  };
}
}
</script>
</body>
</html>
