<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 검색 와이어프레임</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
/* 검색 지우기 버튼 자리(6단계 TextField trailing 슬롯 전까지) */
#q{padding-right:calc(var(--touch-min) + var(--space-1))}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 1416px; box-sizing: border-box; display: flex; flex-direction: column; padding-bottom: var(--space-12); background: var(--bg); color: var(--text-body);">
  <x-import component-from-global-scope="GoodsShop.MobileHeader" back="Main.dc.html" title="상품 검색" cart-count="{{cartCount}}" links="{{links}}"></x-import>

  <form role="search" aria-label="상품 검색" style="margin: 0; padding: var(--space-6) var(--grid-mobile-margin) 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--grid-mobile-gutter); align-items: end;">
    <div style="grid-column: span 3; position: relative; min-width: 0;">
      <x-import component-from-global-scope="GoodsShop.TextField" id="q" type="text" enterkeyhint="search" label="상품명 검색어" value="[키워드]" placeholder="상품명으로 검색"></x-import>
      <div style="position: absolute; right: calc((var(--input-height) - var(--touch-min)) / 2); bottom: calc((var(--input-height) - var(--touch-min)) / 2);">
        <x-import component-from-global-scope="GoodsShop.IconButton" icon="close" label="검색어 지우기"></x-import>
      </div>
    </div>
    <div style="grid-column: span 1; min-width: 0;">
      <x-import component-from-global-scope="GoodsShop.Button" variant="secondary" size="M" full="{{yes}}">검색</x-import>
    </div>
  </form>

  <main style="padding: 0 var(--grid-mobile-margin); display: flex; flex-direction: column;">
    <div style="margin-top: var(--space-8); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--grid-mobile-gutter); align-items: end;">
      <p class="body-sm-14" style="grid-column: span 2; margin: 0; min-height: var(--input-height); display: flex; align-items: center; color: var(--text-sub);"><span>'<b style="color: var(--text);">[키워드]</b>' 검색 결과 <b style="color: var(--text);">[N]</b>개</span></p>
      <div style="grid-column: span 2; min-width: 0;">
        <x-import component-from-global-scope="GoodsShop.SelectField" id="sort" label="정렬" options="{{sortOptions}}" value="최신순"></x-import>
      </div>
    </div>

    <div class="gs-card-grid" style="margin-top: var(--space-8);">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
        <x-import component-from-global-scope="GoodsShop.ProductCard" label="{{p.label}}" href="Detail.dc.html"></x-import>
      </sc-for>
    </div>
  </main>

  <section aria-label="상태 예시: 검색 결과 0건" style="margin: var(--space-12) var(--grid-mobile-margin) 0; padding: var(--card-padding) var(--card-padding) 0; border: var(--line-width) solid var(--line); border-radius: var(--radius-lg);">
    <span class="caption" style="color: var(--text-sub);">상태 예시 · 검색 결과 0건(4.2, 7.10)</span>
    <x-import component-from-global-scope="GoodsShop.EmptyState" title="'[키워드]'에 맞는 상품이 없습니다" action-text="전체 상품 보기" href="List.dc.html" action-variant="secondary"></x-import>
  </section>

  <div style="padding: var(--space-12) var(--grid-mobile-margin) 0;">
    <x-import component-from-global-scope="GoodsShop.Annotation" flush="{{yes}}"><b>검색 대상</b> 상품명만, 판매 중지 상품 제외(P-05, 7.2)<br><b>0건</b> 결과 수·정렬·그리드 대신 위 블록 표시(7.10)<br><b>빈 키워드</b> 검색하지 않고 입력란 아래 "검색어를 입력해 주세요" 안내(가정)</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1416}}'>
class Component extends DCLogic {
renderVals() {
  return {
    yes: true,
    cartCount: 3,
    links: { cart: 'Cart.dc.html' },
    sortOptions: ['최신순', '낮은 가격순', '높은 가격순', '인기순'],
    items: [
      { label: null }, { label: null },
      { label: null }, { label: null }
    ]
  };
}
}
</script>
</body>
</html>
