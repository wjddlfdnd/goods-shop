<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>장바구니 와이어프레임</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/goodsshop/tokens.css">
<link rel="stylesheet" href="ds/goodsshop/bundle.css">
<script src="ds/goodsshop/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="gs-root" style="width: 390px; height: 1360px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text-body); font-family: var(--font-sans);">
  <x-import component-from-global-scope="GoodsShop.MobileHeader" back="Main.dc.html" title-as="p" icons="{{no}}"></x-import>

  <div style="padding: var(--space-6) var(--grid-mobile-margin) var(--space-12);">
    <h1 class="heading-xl-mobile" style="margin: 0; color: var(--text);">장바구니</h1>

    <div style="margin-top: var(--space-4); padding-left: var(--card-padding); display: flex; align-items: center; justify-content: space-between;">
      <x-import component-from-global-scope="GoodsShop.Checkbox" id="all">전체 선택 (2/3)</x-import>
      <x-import component-from-global-scope="GoodsShop.Button" variant="ghost" size="S">선택 삭제</x-import>
    </div>

    <ul style="margin: var(--space-4) 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--space-4);">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
        <li style="padding: var(--card-padding); display: flex; flex-direction: column; gap: var(--space-3); background: var(--bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
          <div style="display: flex; align-items: center;">
            <x-import component-from-global-scope="GoodsShop.Checkbox" id="{{it.id}}" checked="{{yes}}"><span class="gs-sr">{{it.selLabel}}</span></x-import>
            <span class="body-sm-14" style="flex: 1; min-width: 0; color: var(--text-body);">{{it.name}}</span>
            <x-import component-from-global-scope="GoodsShop.IconButton" icon="close" label="{{it.delLabel}}"></x-import>
          </div>
          <div style="display: flex; align-items: flex-start; gap: var(--space-3);">
            <div class="caption" style="flex: none; width: var(--thumb-width); height: var(--thumb-height); border-radius: var(--radius-sm); background: var(--placeholder); color: var(--text-placeholder); display: flex; align-items: center; justify-content: center;">[이미지]</div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1);">
              <span class="caption" style="color: var(--text-sub);">옵션: [옵션명] (+[추가금]원)</span>
              <span class="price-card-15" style="color: var(--text);">[가격]원</span>
              <div style="margin-top: var(--space-1);">
                <x-import component-from-global-scope="GoodsShop.QuantityStepper" value="{{it.qty}}" min="{{one}}" label="{{it.qtyLabel}}"></x-import>
              </div>
            </div>
          </div>
        </li>
      </sc-for>
      <li style="padding: var(--card-padding); display: flex; flex-direction: column; gap: var(--space-3); background: var(--bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
        <div style="display: flex; align-items: center;">
          <x-import component-from-global-scope="GoodsShop.Checkbox" id="c3"><span class="gs-sr">[상품명 3] 선택</span></x-import>
          <span class="body-sm-14" style="flex: 1; min-width: 0; color: var(--text-body);">[상품명 3]</span>
          <x-import component-from-global-scope="GoodsShop.IconButton" icon="close" label="[상품명 3] 삭제"></x-import>
        </div>
        <div style="display: flex; align-items: flex-start; gap: var(--space-3);">
          <div class="caption" style="flex: none; width: var(--thumb-width); height: var(--thumb-height); border-radius: var(--radius-sm); background: var(--placeholder); color: var(--text-placeholder); display: flex; align-items: center; justify-content: center;">[이미지]</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1);">
            <x-import component-from-global-scope="GoodsShop.Label" kind="soldout"></x-import>
            <span class="caption" style="color: var(--text-sub);">옵션: [옵션명] · 수량 1</span>
            <span class="caption" style="color: var(--text-body);">선택한 옵션이 품절되었습니다. 선택 해제하거나 삭제해 주세요.</span>
          </div>
        </div>
      </li>
    </ul>

    <section aria-label="주문 요약" style="margin-top: var(--space-12);">
      <x-import component-from-global-scope="GoodsShop.OrderSummary" rows="{{summaryRows}}" total="{{summaryTotal}}"></x-import>
    </section>

    <x-import component-from-global-scope="GoodsShop.Annotation"><b>구매 불가</b> 품절·판매 중지·재고 부족은 라벨 + 사유, 선택 시 주문하기 비활성(O-02)<br><b>빈 상태</b> "장바구니가 비어 있습니다" + <a class="gs-link gs-link--strong" href="List.dc.html"><span>상품 보러 가기 →</span></a> 버튼(7.10), 주문하기 비활성</x-import>
  </div>

  <div style="margin-top: auto;">
    <x-import component-from-global-scope="GoodsShop.StickyBar" static="{{yes}}">
      <x-import component-from-global-scope="GoodsShop.Button" variant="primary" size="L" full="{{yes}}" href="Order.dc.html">선택 상품 주문하기</x-import>
    </x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1360}}'>
class Component extends DCLogic {
renderVals() {
  const rows = [
    { id: 'c1', name: '[상품명 1]', qty: 1 },
    { id: 'c2', name: '[상품명 2]', qty: 2 }
  ];
  return {
    yes: true,
    no: false,
    one: 1,
    items: rows.map(r => ({
      id: r.id,
      name: r.name,
      qty: r.qty,
      selLabel: r.name + ' 선택',
      qtyLabel: r.name + ' 수량',
      delLabel: r.name + ' 삭제'
    })),
    summaryRows: [
      { label: '상품 금액', value: '[가격]원' },
      { label: '배송비', value: '0원' },
      { label: '할인', value: '0원' }
    ],
    summaryTotal: { label: '예상 결제 금액', value: '[가격]원' }
  };
}
}
</script>
</body>
</html>
